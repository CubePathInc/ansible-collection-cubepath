---
- name: MySQL managed database with an application schema and user
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cubepath_token: "{{ lookup('env', 'CUBEPATH_API_TOKEN') }}"
  tasks:
    - name: Create the database cluster
      cubepathinc.cloud.managed_database:
        api_token: "{{ cubepath_token }}"
        name: app-db
        project_id: 1
        engine: mysql
        version: "8.0.39"
        plan: mysql.micro
        location: eu-bcn-1
        replicas: 3
        protected: true
        state: present
      register: db

    - name: Create the application schema
      cubepathinc.cloud.managed_database_db:
        api_token: "{{ cubepath_token }}"
        managed_database: app-db
        name: app
        state: present

    - name: Create the application user
      cubepathinc.cloud.managed_database_user:
        api_token: "{{ cubepath_token }}"
        managed_database: app-db
        username: app_user
        state: present
      register: app_user
      no_log: true

    - name: Read the admin connection details
      cubepathinc.cloud.managed_database_info:
        api_token: "{{ cubepath_token }}"
        managed_database: app-db
        gather:
          - credentials
      register: app_db
      no_log: true
