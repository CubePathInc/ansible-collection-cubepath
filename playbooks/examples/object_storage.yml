---
- name: Object Storage bucket served through the CDN
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cubepath_token: "{{ lookup('env', 'CUBEPATH_API_TOKEN') }}"
  tasks:
    - name: Create bucket
      cubepathinc.cloud.object_storage_bucket:
        api_token: "{{ cubepath_token }}"
        name: my-assets
        tier: infrequent_access
        versioning: enabled
        tags:
          env: prod
          team: web
        state: present
      register: bucket

    - name: Add an owner tag and keep the others
      cubepathinc.cloud.object_storage_bucket:
        api_token: "{{ cubepath_token }}"
        name: my-assets
        tags:
          owner: platform
        purge_tags: false

    - name: List the production buckets
      cubepathinc.cloud.object_storage_info:
        api_token: "{{ cubepath_token }}"
        gather: [buckets]
        tags:
          env: prod
      register: prod_buckets

    - name: Create an access key for the application
      cubepathinc.cloud.object_storage_access_key:
        api_token: "{{ cubepath_token }}"
        name: my-app
        tier: infrequent_access
        buckets:
          - my-assets
        state: present
      register: key
      no_log: true

    - name: Create CDN zone
      cubepathinc.cloud.cdn_zone:
        api_token: "{{ cubepath_token }}"
        name: my-assets-cdn
        plan: cdn.standard
        state: present
      register: cdn

    - name: Serve the bucket through the CDN
      cubepathinc.cloud.cdn_origin:
        api_token: "{{ cubepath_token }}"
        zone_uuid: "{{ cdn.zone.uuid }}"
        name: assets-bucket
        object_storage_bucket_uuid: "{{ bucket.bucket.uuid }}"
        state: present

    # Bucket tags are not visible through S3. Object tags are standard S3 object
    # tagging, for example:
    #   aws s3api put-object-tagging --bucket my-assets --key logo.png \
    #     --tagging 'TagSet=[{Key=class,Value=static}]' --endpoint-url <endpoint>
